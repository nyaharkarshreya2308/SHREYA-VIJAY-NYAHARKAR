<DOCTYPE html>
<html>
<head>
   <title>Student Registration Form</title>
</head>

<body>
 
   <div class="container">
   <h2>Student Registration Form</h2>
   
   <form id="Student Form">
   <input type="text" id="name" 
       placeholder="Enter your name" required>
   
   </div>
   
   <div>
       <input type="email" id="email"
           placeholder="Enter your email" required>
    </div>
    
    <div>
       <select id="course" required>
       <option value="">Select Course</option>
       <option value="IT">Information Technology</opiton>
       <option value="Computer Engineering>Computer Engineering</option>
       <option value="Mechanical Engineering">Mechanical Engineering</option>
       <option value="Electricai Enginnering">Electrical Engineering</option> 
       <option value="Civil Engineering">Civil Engineering</option>
       <option value="Mecatronics">Mecatronics</option>
      </select>
    </div>
    
    <div>
      <p>Select Gender:</p>
      
      <label>
        <input type="radio" name="gender"
                value="Male" required> Male
      </label>
      
      <label>
        <input type="radio" name="gender"
                value="Female" required> Female
      </lable>
      
     <br>
     
     <button type="submit">Register</button>
     </div>
 
  </form>
  
  </body>
  
</html>
